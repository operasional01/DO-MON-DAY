    function handleExcelUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: &#x27;array&#x27; });
          const firstSheetName = workbook.SheetNames[0];
          const worksheet = workbook.Sheets[firstSheetName];
          
          const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

          if (rows.length &lt; 2) {
            alert(&quot;File Excel kosong atau tidak berisi cukup data!&quot;);
            return;
          }

          let dataImpor = [];
          const header = rows[0].map(h =&gt; String(h || &#x27;&#x27;).toLowerCase().trim());
          
          let idxNama = header.findIndex(h =&gt; h.includes(&#x27;nama&#x27;) || h.includes(&#x27;hari&#x27;) || h.includes(&#x27;day&#x27;));
          let idxHari = header.findIndex(h =&gt; h.includes(&#x27;ke&#x27;) || h.includes(&#x27;no&#x27;) || h.includes(&#x27;index&#x27;) || h.includes(&#x27;num&#x27;));
          let idxVLL = header.findIndex(h =&gt; h.includes(&#x27;vll&#x27;) || h.includes(&#x27;volume&#x27;) || h.includes(&#x27;lalin&#x27;) || h.includes(&#x27;jumlah&#x27;));

          if (idxNama === -1) idxNama = 0;
          if (idxHari === -1) idxHari = 1;
          if (idxVLL === -1) idxVLL = 2;

          for (let i = 1; i &lt; rows.length; i++) {
            const row = rows[i];
            if (!row || row.length === 0) continue;

            let valNama = row[idxNama] !== undefined &amp;&amp; row[idxNama] !== null ? String(row[idxNama]).trim() : \`Hari \${i}\`;
            let valHari = parseInt(row[idxHari]);
            let valVLL = parseFloat(row[idxVLL]);

            if (isNaN(valHari)) valHari = i;
            
            if (!isNaN(valVLL) &amp;&amp; valVLL &gt; 0) {
              dataImpor.push({ namaHari: valNama, hari: valHari, vll: valVLL });
            }
          }

          if (dataImpor.length &gt;= 2) {
            renderFormInputs(dataImpor);
            updateFormKoreksiUI(true);
            simpanDanProses();
            alert(\`Berhasil mengimpor \${dataImpor.length} baris data Excel!\`);
          } else {
            alert(&quot;Gagal membaca data VLL dari file. Pastikan ada kolom data angka untuk VLL!&quot;);
          }
        } catch (err) {
          console.error(err);
          alert(&quot;Gagal membaca file Excel.&quot;);
        }
      };
      
      reader.readAsArrayBuffer(file);
      event.target.value = &#x27;&#x27;;
    }

    function simpanDanProses() {
      const namaHariInputs = document.querySelectorAll(&#x27;.nama-hari-input&#x27;);
      const hariInputs = document.querySelectorAll(&#x27;.hari-input&#x27;);
      const vllInputs = document.querySelectorAll(&#x27;.vll-input&#x27;);

      let dataHistoris = [];
      for (let i = 0; i &lt; hariInputs.length; i++) {
        const nm = namaHariInputs[i].value || \`Hari \${i+1}\`;
        const hr = parseInt(hariInputs[i].value);
        const vll = parseFloat(vllInputs[i].value);
        if (!isNaN(hr) &amp;&amp; !isNaN(vll) &amp;&amp; vll &gt; 0) {
          dataHistoris.push({ namaHari: nm, hari: hr, vll: vll });
        }
      }

      const koreksiInputs = document.querySelectorAll(&#x27;.koreksi-input&#x27;);
      let mapKoreksi = {};
      koreksiInputs.forEach(i =&gt; {
        const hr = i.getAttribute(&#x27;data-hari&#x27;);
        const val = parseFloat(i.value) || 0;
        mapKoreksi[hr] = val;
      });

      const koreksiMingguanInputs = document.querySelectorAll(&#x27;.koreksi-minggu-input&#x27;);
      let mapKoreksiMingguan = {};
      koreksiMingguanInputs.forEach(i =&gt; {
        const mg = i.getAttribute(&#x27;data-minggu&#x27;);
        const val = parseFloat(i.value) || 0;
        mapKoreksiMingguan[mg] = val;
      });

      const vllMax = parseFloat(document.getElementById(&#x27;vllMaxInput&#x27;).value) || 0;
      const vllMin = parseFloat(document.getElementById(&#x27;vllMinInput&#x27;).value) || 0;
      const vllTarget = parseFloat(document.getElementById(&#x27;vllTargetInput&#x27;).value) || 0;
      const tarifRataRata = parseFloat(document.getElementById(&#x27;tarifRataRataInput&#x27;).value) || 0;
      const confidenceLevel = parseFloat(document.getElementById(&#x27;confidenceLevelInput&#x27;).value);
      const confVal = !isNaN(confidenceLevel) ? Math.min(100, Math.max(0, confidenceLevel)) : 100;

      localStorage.setItem(STORAGE_KEY_HISTORIS, JSON.stringify(dataHistoris));
      localStorage.setItem(STORAGE_KEY_DURASI, document.getElementById(&#x27;durasiProyeksi&#x27;).value);
      localStorage.setItem(STORAGE_KEY_KOREKSI, JSON.stringify(mapKoreksi));
      localStorage.setItem(STORAGE_KEY_KOREKSI_MINGGUAN, JSON.stringify(mapKoreksiMingguan));
      localStorage.setItem(STORAGE_KEY_VLL_MAX, vllMax);
      localStorage.setItem(STORAGE_KEY_VLL_MIN, vllMin);
      localStorage.setItem(STORAGE_KEY_VLL_TARGET, vllTarget);
      localStorage.setItem(STORAGE_KEY_TARIF, tarifRataRata);
      localStorage.setItem(STORAGE_KEY_CONFIDENCE, confVal);

      const rentangKapasitas = Math.max(0, vllMax - vllMin);
      document.getElementById(&#x27;valRentangKapasitas&#x27;).innerText = \`\${rentangKapasitas.toLocaleString(&#x27;id-ID&#x27;)} Kendaraan\`;

      kalkulasiDanRender(dataHistoris, mapKoreksi, mapKoreksiMingguan, vllMax, vllMin, vllTarget, tarifRataRata, confVal);
      renderGridRataRata7Hari(dataHistoris);
    }

    function kalkulasiDanRender(dataHistoris, mapKoreksi, mapKoreksiMingguan, vllMax, vllMin, vllTarget, tarifRataRata, confidenceLevel = 100) {
      dataHistoris.sort((a, b) =&gt; a.hari - b.hari);
      if (dataHistoris.length &lt; 2) return;

      const dataAwal = dataHistoris[0];
      const dataAkhir = dataHistoris[dataHistoris.length - 1];
      const nHistoris = dataAkhir.hari - dataAwal.hari;

      if (nHistoris &lt;= 0) return;

      const baseCAGR = Math.pow(dataAkhir.vll / dataAwal.vll, 1 / nHistoris) - 1;
      const totalGrowth = ((dataAkhir.vll - dataAwal.vll) / dataAwal.vll) * 100;

      const totalVLLHistoris = dataHistoris.reduce((acc, curr) =&gt; acc + curr.vll, 0);
      const avgVLLHistoris = totalVLLHistoris / dataHistoris.length;

      const durasi = parseInt(document.getElementById(&#x27;durasiProyeksi&#x27;).value) || 1;
      let dataProyeksi = [];
      let vllSebelumnya = dataAkhir.vll;
      let totalVLLProyeksi = 0;

      const confRatio = confidenceLevel / 100;

      for (let h = 1; h &lt;= durasi; h++) {
        const hariProyeksi = dataAkhir.hari + h;
        const mingguKe = Math.ceil(h / 7);

        const koreksiPersenHari = mapKoreksi[hariProyeksi] || 0;
        const koreksiPersenMinggu = mapKoreksiMingguan[mingguKe] || 0;

        // Formula Gabungan: Base CAGR + Koreksi Harian (%) + Koreksi Mingguan (%)
        const lajuMurni = baseCAGR + (koreksiPersenHari / 100) + (koreksiPersenMinggu / 100);
        
        // Penerapan Tingkat Kepercayaan Proyeksi (Confidence Level)
        const lajuEfektif = lajuMurni * confRatio;
        
        const vllProyeksi = vllSebelumnya * (1 + lajuEfektif);
        const sisaKapasitas = vllMax - vllProyeksi;
        const rasioOkupansi = vllTarget &gt; 0 ? (vllProyeksi / vllTarget) * 100 : 0;

        dataProyeksi.push({
          namaHari: \`Proyeksi H-\${hariProyeksi}\`,
          hari: hariProyeksi,
          mingguKe: mingguKe,
          vll: vllProyeksi,
          sisaKapasitas: sisaKapasitas,
          rasioOkupansi: rasioOkupansi,
          lajuEfektif: lajuEfektif * 100
        });

        totalVLLProyeksi += vllProyeksi;
        vllSebelumnya = vllProyeksi;
      }

      const totalHari = dataHistoris.length + dataProyeksi.length;
      const avgVLLProyeksi = totalVLLProyeksi / dataProyeksi.length;
      const avgVLLTotal = (totalVLLHistoris + totalVLLProyeksi) / totalHari;

      const totalVLLGabungan = totalVLLHistoris + totalVLLProyeksi;
      const proyeksiPendapatanMentah = totalVLLGabungan * tarifRataRata;
      const proyeksiPendapatan = Math.floor(proyeksiPendapatanMentah / 1000) * 1000;

      // Estimasi Pendapatan Proyeksi Saja
      const pendapatanProyeksiSajaMentah = totalVLLProyeksi * tarifRataRata;
      const pendapatanProyeksiSaja = Math.floor(pendapatanProyeksiSajaMentah / 1000) * 1000;

      document.getElementById(&#x27;resPeriode&#x27;).innerText = \`\${nHistoris} Hari\`;
      document.getElementById(&#x27;resGrowth&#x27;).innerText = \`\${totalGrowth &gt;= 0 ? &#x27;+&#x27; : &#x27;&#x27;}\${totalGrowth.toFixed(2)}%\`;
      document.getElementById(&#x27;resCAGR&#x27;).innerText = \`\${(baseCAGR * 100) &gt;= 0 ? &#x27;+&#x27; : &#x27;&#x27;}\${(baseCAGR * 100).toFixed(2)}%\`;
      document.getElementById(&#x27;resAvgVLL&#x27;).innerText = \`\${Math.round(avgVLLHistoris).toLocaleString(&#x27;id-ID&#x27;)}\`;
      document.getElementById(&#x27;resAvgVLLProyeksi&#x27;).innerText = \`\${Math.round(avgVLLProyeksi).toLocaleString(&#x27;id-ID&#x27;)}\`;

      // Element Tampilan Pendapatan
      document.getElementById(&#x27;valEstimasiPendapatanProyeksiSaja&#x27;).innerText = \`Rp \${pendapatanProyeksiSaja.toLocaleString(&#x27;id-ID&#x27;)}\`;
      document.getElementById(&#x27;valProyeksiPendapatan&#x27;).innerText = \`Rp \${proyeksiPendapatan.toLocaleString(&#x27;id-ID&#x27;)}\`;
      document.getElementById(&#x27;detailFormulaPendapatan&#x27;).innerText = \`Formula: Total VLL Prognosa (\${Math.round(totalVLLGabungan).toLocaleString(&#x27;id-ID&#x27;)} Kr) × Rp \${tarifRataRata.toLocaleString(&#x27;id-ID&#x27;)}\`;

      renderTabelProyeksi(dataProyeksi, vllMax, vllMin, vllTarget, avgVLLTotal);
      renderChart(dataHistoris, dataProyeksi, vllMax, vllMin, vllTarget, avgVLLHistoris, avgVLLTotal);
      generateAnalisisText(dataHistoris, dataProyeksi, vllMax, vllMin, vllTarget, avgVLLTotal, baseCAGR);
    }

    function renderGridRataRata7Hari(dataHistoris) {
      const container = document.getElementById(&#x27;gridHariGrowth&#x27;);
      container.innerHTML = &#x27;&#x27;;

      if (!dataHistoris || dataHistoris.length === 0) return;

      const sorted = [...dataHistoris].sort((a, b) =&gt; a.hari - b.hari);

      const dataWithGrowth = sorted.map((item, index) =&gt; {
        let growth = null;
        if (index &gt; 0) {
          const vllLalu = sorted[index - 1].vll;
          if (vllLalu &gt; 0) {
            growth = ((item.vll / vllLalu) - 1) * 100;
          }
        }
        return { ...item, growth: growth };
      });

      let group7Hari = {};
      LIST_HARI_STANDAR.forEach(h =&gt; {
        group7Hari[h] = { listVll: [], listGrowth: [] };
      });

      dataWithGrowth.forEach(item =&gt; {
        const nama = (item.namaHari || &#x27;&#x27;).trim();
        const matchHari = LIST_HARI_STANDAR.find(h =&gt; h.toLowerCase() === nama.toLowerCase());
        
        if (matchHari) {
          group7Hari[matchHari].listVll.push(item.vll);
          if (item.growth !== null) {
            group7Hari[matchHari].listGrowth.push(item.growth);
          }
        }
      });

      let totalAvgVll7Hari = 0;
      LIST_HARI_STANDAR.forEach(hari =&gt; {
        const arrVll = group7Hari[hari].listVll;
        if (arrVll.length &gt; 0) {
          const avgVll = arrVll.reduce((a, b) =&gt; a + b, 0) / arrVll.length;
          totalAvgVll7Hari += avgVll;
        }
      });

      LIST_HARI_STANDAR.forEach(hari =&gt; {
        const dataHari = group7Hari[hari];
        const countData = dataHari.listVll.length;

        let avgVllText = &#x27;-&#x27;;
        let avgGrowthText = &#x27;0.00%&#x27;;
        let growthColor = &#x27;text-slate-400&#x27;;
        let kontribusiText = &#x27;0.00%&#x27;;

        if (countData &gt; 0) {
          const avgVll = dataHari.listVll.reduce((a, b) =&gt; a + b, 0) / countData;
          avgVllText = Math.round(avgVll).toLocaleString(&#x27;id-ID&#x27;);

          if (totalAvgVll7Hari &gt; 0) {
            const kontribusi = (avgVll / totalAvgVll7Hari) * 100;
            kontribusiText = \`\${kontribusi.toFixed(2)}%\`;
          }

          if (dataHari.listGrowth.length &gt; 0) {
            const avgGrowth = dataHari.listGrowth.reduce((a, b) =&gt; a + b, 0) / dataHari.listGrowth.length;
            const sign = avgGrowth &gt;= 0 ? &#x27;+&#x27; : &#x27;&#x27;;
            avgGrowthText = \`\${sign}\${avgGrowth.toFixed(2)}%\`;
            growthColor = avgGrowth &gt;= 0 ? &#x27;text-emerald-400&#x27; : &#x27;text-rose-400&#x27;;
          }
        }

        const div = document.createElement(&#x27;div&#x27;);
        div.className = &#x27;p-3 rounded-lg border bg-slate-900/90 border-slate-700 flex flex-col justify-between space-y-2&#x27;;
        
        div.innerHTML = \`
          &lt;div class=&quot;flex justify-between items-center border-b border-slate-800 pb-1&quot;&gt;
            &lt;span class=&quot;text-xs font-bold text-emerald-400&quot;&gt;\${hari}&lt;/span&gt;
            &lt;span class=&quot;text-[9px] px-1.5 py-0.5 rounded bg-slate-800 text-slate-400 border border-slate-700 font-mono&quot;&gt;\${countData} Data&lt;/span&gt;
          &lt;/div&gt;
          
          &lt;div&gt;
            &lt;span class=&quot;text-[10px] text-slate-400 block&quot;&gt;Rata-rata Growth:&lt;/span&gt;
            &lt;span class=&quot;text-base font-extrabold font-mono \${growthColor}&quot;&gt;\${avgGrowthText}&lt;/span&gt;
            &lt;span class=&quot;text-[9px] text-slate-500 block&quot;&gt;Avg VLL: \${avgVllText}&lt;/span&gt;
          &lt;/div&gt;

          &lt;div class=&quot;pt-1.5 border-t border-slate-800 flex justify-between items-center text-[10px]&quot;&gt;
            &lt;span class=&quot;text-slate-400&quot;&gt;Rata-rata Kontribusi:&lt;/span&gt;
            &lt;span class=&quot;font-bold font-mono text-cyan-400&quot;&gt;\${kontribusiText}&lt;/span&gt;
          &lt;/div&gt;
        \`;

        container.appendChild(div);
      });
    }

    function generateAnalisisText(dataHistoris, dataProyeksi, vllMax, vllMin, vllTarget, avgVLLTotal, baseCAGR = 0) {
      const container = document.getElementById(&#x27;analisisText&#x27;);
      const tagStatus = document.getElementById(&#x27;analisisStatusTag&#x27;);
      
      const vllPuncak = dataHistoris.reduce((max, item) =&gt; item.vll &gt; max.vll ? item : max, dataHistoris[0] || { hari: 0, vll: 0, namaHari: &#x27;-&#x27; });
      const vllTerendah = dataHistoris.reduce((min, item) =&gt; item.vll &lt; min.vll ? item : min, dataHistoris[0] || { hari: 0, vll: 0, namaHari: &#x27;-&#x27; });
      
      // Mengambil titik puncak teratas proyeksi yang melampaui VLL Max (jika ada)
      const listOverload = dataProyeksi.filter(p =&gt; vllMax &gt; 0 &amp;&amp; p.vll &gt; vllMax);
      const hariOverload = listOverload.length &gt; 0 
        ? listOverload.reduce((max, p) =&gt; p.vll &gt; max.vll ? p : max, listOverload[0]) 
        : null;

      // Mengambil titik terendah proyeksi yang di bawah VLL Min (jika ada)
      const listUnderload = dataProyeksi.filter(p =&gt; vllMin &gt; 0 &amp;&amp; p.vll &lt; vllMin);
      const hariUnderload = listUnderload.length &gt; 0 
        ? listUnderload.reduce((min, p) =&gt; p.vll &lt; min.vll ? p : min, listUnderload[0]) 
        : null;

      let textList = [];

      textList.push(\`• Realisasi VLL Max : Terjadi pada &lt;span class=&quot;text-white font-bold&quot;&gt;H-\${vllPuncak.hari}&lt;/span&gt; dengan VLL &lt;span class=&quot;text-rose-400 font-bold ml-1&quot;&gt;\${Math.round(vllPuncak.vll).toLocaleString(&#x27;id-ID&#x27;)} Kr/Hari&lt;/span&gt; &lt;span class=&quot;text-[10px] text-rose-400 font-bold&quot;&gt;(🔴 Titik Merah)&lt;/span&gt;.\`);
      textList.push(\`• Realisasi VLL Min : Terjadi pada &lt;span class=&quot;text-white font-bold&quot;&gt;H-\${vllTerendah.hari}&lt;/span&gt; dengan VLL &lt;span class=&quot;text-cyan-400 font-bold ml-1&quot;&gt;\${Math.round(vllTerendah.vll).toLocaleString(&#x27;id-ID&#x27;)} Kr/Hari&lt;/span&gt; &lt;span class=&quot;text-[10px] text-cyan-400 font-bold&quot;&gt;(🔵 Titik Cyan)&lt;/span&gt;.\`);

      if (vllTarget &gt; 0) {
        const persenTarget = (avgVLLTotal / vllTarget) * 100;
        const statusTarget = avgVLLTotal &gt;= vllTarget ? &#x27;Melampaui Target&#x27; : &#x27;Di Bawah Target&#x27;;
        const targetColor = avgVLLTotal &gt;= vllTarget ? &#x27;emerald-400&#x27; : &#x27;amber-400&#x27;;

        textList.push(\`• Target VLL : Target sebesar &lt;span class=&quot;text-red-500 font-bold&quot;&gt;\${vllTarget.toLocaleString(&#x27;id-ID&#x27;)} Kr/Hari&lt;/span&gt;, estimasi rata-rata total tercapai : &lt;span class=&quot;text-white font-bold&quot;&gt;\${persenTarget.toFixed(2)}%&lt;/span&gt; (&lt;span class=&quot;text-\${targetColor} font-semibold&quot;&gt;\${statusTarget}&lt;/span&gt;).\`);
      }

      if (hariOverload) {
        tagStatus.innerText = &#x27;Ada Proyeksi VLL Di Atas VLL Max&#x27;;
        tagStatus.className = &#x27;px-2 py-0.5 rounded text-[10px] font-semibold bg-rose-500/20 text-rose-400 border border-rose-500/30&#x27;;
        textList.push(\`• &lt;span class=&quot;text-amber-400 font-bold&quot;&gt;VLL Proyeksi&lt;/span&gt; : Kenaikan VLL melampaui VLL Max pada &lt;span class=&quot;text-white font-bold&quot;&gt;H-\${hariOverload.hari}&lt;/span&gt; dengan estimasi &lt;span class=&quot;text-rose-400 font-bold&quot;&gt;\${Math.round(hariOverload.vll).toLocaleString(&#x27;id-ID&#x27;)} Kr/Hari&lt;/span&gt;.\`);
      } else if (hariUnderload) {
        tagStatus.innerText = &#x27;Ada Proyeksi VLL Di Bawah VLL Min&#x27;;
        tagStatus.className = &#x27;px-2 py-0.5 rounded text-[10px] font-semibold bg-amber-500/20 text-amber-400 border border-amber-500/30&#x27;;
        textList.push(\`• &lt;span class=&quot;text-amber-400 font-bold&quot;&gt;VLL Proyeksi&lt;/span&gt; : Penurunan VLL di bawah VLL Min pada &lt;span class=&quot;text-white font-bold&quot;&gt;H-\${hariUnderload.hari}&lt;/span&gt; dengan estimasi &lt;span class=&quot;text-amber-400 font-bold&quot;&gt;\${Math.round(hariUnderload.vll).toLocaleString(&#x27;id-ID&#x27;)} Kr/Hari&lt;/span&gt;.\`);
      } else {
        if (vllMax &gt; 0 || vllMin &gt; 0) {
          tagStatus.innerText = &#x27;Proyeksi Di VLL Normal&#x27;;
          tagStatus.className = &#x27;px-2 py-0.5 rounded text-[10px] font-semibold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30&#x27;;
          textList.push(\`• &lt;span class=&quot;text-amber-400 font-bold&quot;&gt;VLL Proyeksi&lt;/span&gt; : Volume kendaraan masih di dalam area batas atas &amp; batas bawah.\`);
        } else {
          tagStatus.innerText = &#x27;Batas VLL Belum Diatur&#x27;;
          tagStatus.className = &#x27;px-2 py-0.5 rounded text-[10px] font-semibold bg-amber-500/20 text-amber-400 border border-amber-500/30&#x27;;
          textList.push(\`• Atur parameter VLL Max / Min pada bagian (5) untuk melihat analisis kapasitas jalan.\`);
        }
      }

      const cagrPersen = (baseCAGR * 100);
      const signCagr = cagrPersen &gt;= 0 ? &#x27;+&#x27; : &#x27;&#x27;;
      const growthMingguan = (Math.pow(1 + baseCAGR, 7) - 1) * 100;
      const signMingguan = growthMingguan &gt;= 0 ? &#x27;+&#x27; : &#x27;&#x27;;

      textList.push(\`• &lt;span class=&quot;text-cyan-400 font-bold&quot;&gt;Analisis Akumulasi Pertambahan LHR&lt;/span&gt; : Daily CAGR sebesar &lt;span class=&quot;text-emerald-400 font-bold&quot;&gt;\${signCagr}\${cagrPersen.toFixed(2)}%&lt;/span&gt; menghasilkan estimasi pertumbuhan baseline &lt;span class=&quot;text-cyan-300 font-bold&quot;&gt;\${signMingguan}\${growthMingguan.toFixed(2)}%&lt;/span&gt; per siklus 7 hari (sebelum koreksi mingguan kalender).\`);

      container.innerHTML = textList.map(t =&gt; \`&lt;div&gt;\${t}&lt;/div&gt;\`).join(&#x27;&#x27;);
    }

    function renderTabelProyeksi(dataProyeksi, vllMax, vllMin, vllTarget, avgVLLTotal) {
      const tbody = document.getElementById(&#x27;tabelProyeksiBody&#x27;);
      tbody.innerHTML = &#x27;&#x27;;

      dataProyeksi.forEach(d =&gt; {
        let statusBadge = &#x27;&#x27;;
        if (vllTarget &gt; 0) {
          if (d.vll &gt;= vllTarget) {
            statusBadge = \`&lt;span class=&quot;text-emerald-400 font-semibold&quot;&gt;\${d.rasioOkupansi.toFixed(2)}%&lt;/span&gt;\`;
          } else {
            statusBadge = \`&lt;span class=&quot;text-amber-400 font-semibold&quot;&gt;\${d.rasioOkupansi.toFixed(2)}%&lt;/span&gt;\`;
          }
        } else {
          statusBadge = \`&lt;span class=&quot;text-slate-500&quot;&gt;-&lt;/span&gt;\`;
        }

        const sisaText = vllMax &gt; 0 ? Math.round(d.sisaKapasitas).toLocaleString(&#x27;id-ID&#x27;) : &#x27;-&#x27;;
        const statusClass = d.sisaKapasitas &lt; 0 ? &#x27;text-rose-400 font-bold&#x27; : &#x27;text-slate-300&#x27;;

        const row = document.createElement(&#x27;tr&#x27;);
        row.className = &#x27;hover:bg-slate-800/60&#x27;;
        row.innerHTML = \`
          &lt;td class=&quot;py-2 text-slate-300 font-bold&quot;&gt;H-\${d.hari} &lt;span class=&quot;text-[9px] text-cyan-400 font-normal&quot;&gt;(M-\${d.mingguKe})&lt;/span&gt;&lt;/td&gt;
          &lt;td class=&quot;py-2 text-center font-bold text-amber-400&quot;&gt;\${Math.round(d.vll).toLocaleString(&#x27;id-ID&#x27;)}&lt;/td&gt;
          &lt;td class=&quot;py-2 text-center \${statusClass}&quot;&gt;\${sisaText}&lt;/td&gt;
          &lt;td class=&quot;py-2 text-center&quot;&gt;\${statusBadge}&lt;/td&gt;
        \`;
        tbody.appendChild(row);
      });

      const avgOkupansiTotal = vllTarget &gt; 0 ? (avgVLLTotal / vllTarget) * 100 : 0;

      document.getElementById(&#x27;valVLLTarget&#x27;).innerText = \`\${Math.round(avgVLLTotal).toLocaleString(&#x27;id-ID&#x27;)} Kr  ==&gt;\`;
      
      let targetStatusText = vllTarget &gt; 0 ? \`Tercapai: \${avgOkupansiTotal.toFixed(2)}%\` : &#x27;-&#x27;;
      document.getElementById(&#x27;valOkupansiTarget&#x27;).innerText = targetStatusText;

      const valGapElem = document.getElementById(&#x27;valGapTarget&#x27;);
      const valStatusPencapaian = document.getElementById(&#x27;valStatusPencapaian&#x27;);

      if (vllTarget &gt; 0) {
        const gap = avgVLLTotal - vllTarget;
        const signGap = gap &gt;= 0 ? &#x27;+&#x27; : &#x27;&#x27;;
        
        valGapElem.innerText = \`Selisih: \${signGap}\${Math.round(gap).toLocaleString(&#x27;id-ID&#x27;)} Kr dari target\`;

        if (gap &gt;= 0) {
          valStatusPencapaian.innerHTML = \`&lt;span class=&quot;text-emerald-400&quot;&gt;✓ Tercapai&lt;/span&gt;\`;
        } else {
          valStatusPencapaian.innerHTML = \`&lt;span class=&quot;text-rose-400&quot;&gt;✗ Tidak Tercapai&lt;/span&gt;\`;
        }
      } else {
        valGapElem.innerText = &#x27;Target Belum Diatur&#x27;;
        valStatusPencapaian.innerHTML = \`&lt;span class=&quot;text-slate-500&quot;&gt;-&lt;/span&gt;\`;
      }
    }

    function renderChart(dataHistoris, dataProyeksi, vllMax, vllMin, vllTarget, avgVLLHistoris, avgVLLTotal) {
      const ctx = document.getElementById(&#x27;vllChart&#x27;).getContext(&#x27;2d&#x27;);
      
      const labels = [
        ...dataHistoris.map(d =&gt; \`H-\${d.hari}\`), 
        ...dataProyeksi.map(d =&gt; \`H-\${d.hari}\`)
      ];

      const vllPuncak = dataHistoris.reduce((max, item) =&gt; item.vll &gt; max.vll ? item : max, dataHistoris[0]);
      const vllTerendah = dataHistoris.reduce((min, item) =&gt; item.vll &lt; min.vll ? item : min, dataHistoris[0]);

      const dataReal = [...dataHistoris.map(d =&gt; d.vll), ...dataProyeksi.map(() =&gt; null)];
      const dataProj = [
        ...dataHistoris.map((d, index) =&gt; index === dataHistoris.length - 1 ? d.vll : null),
        ...dataProyeksi.map(d =&gt; d.vll)
      ];

      function getPointStyling(datasetArray, isProjection = false) {
        let bgColors = [];
        let borderColors = [];
        let radii = [];

        datasetArray.forEach((val, idx) =&gt; {
          if (val === null) {
            bgColors.push(null);
            borderColors.push(null);
            radii.push(0);
            return;
          }

          const currentHari = labels[idx].replace(&#x27;H-&#x27;, &#x27;&#x27;);
          const isPuncak = currentHari == vllPuncak.hari;
          const isTerendah = currentHari == vllTerendah.hari;

          if (isPuncak &amp;&amp; !isProjection) {
            bgColors.push(&#x27;#f43f5e&#x27;);
            borderColors.push(&#x27;#ffffff&#x27;);
            radii.push(8);
          } else if (isTerendah &amp;&amp; !isProjection) {
            bgColors.push(&#x27;#06b6d4&#x27;);
            borderColors.push(&#x27;#ffffff&#x27;);
            radii.push(8);
          } else {
            const defaultColor = isProjection ? &#x27;#f59e0b&#x27; : &#x27;#10b981&#x27;;
            bgColors.push(defaultColor);
            borderColors.push(defaultColor);
            radii.push(4);
          }
        });

        return { bgColors, borderColors, radii };
      }

      const styleReal = getPointStyling(dataReal, false);
      const styleProj = getPointStyling(dataProj, true);
      
      const lineMax = labels.map(() =&gt; vllMax);
      const lineMin = labels.map(() =&gt; vllMin);
      const lineTarget = labels.map(() =&gt; vllTarget);
      const lineAvgTotal = labels.map(() =&gt; avgVLLTotal);

      if (chartInstance) chartInstance.destroy();

      chartInstance = new Chart(ctx, {
        type: &#x27;line&#x27;,
        data: {
          labels: labels,
          datasets: [
            {
              label: &#x27;Realisasi VLL&#x27;,
              data: dataReal,
              borderColor: &#x27;#10b981&#x27;,
              backgroundColor: &#x27;#10b981&#x27;,
              borderWidth: 3,
              tension: 0.2,
              pointBackgroundColor: styleReal.bgColors,
              pointBorderColor: styleReal.borderColors,
              pointBorderWidth: 2,
              pointRadius: styleReal.radii
            },
            {
              label: &#x27;Proyeksi VLL&#x27;,
              data: dataProj,
              borderColor: &#x27;#f59e0b&#x27;,
              backgroundColor: &#x27;#f59e0b&#x27;,
              borderWidth: 2,
              borderDash: [5, 5],
              tension: 0.2,
              pointBackgroundColor: styleProj.bgColors,
              pointBorderColor: styleProj.borderColors,
              pointBorderWidth: 2,
              pointRadius: styleProj.radii
            },
            {
              label: &#x27;Target VLL&#x27;,
              data: lineTarget,
              borderColor: &#x27;#ef4444&#x27;,
              backgroundColor: &#x27;#ef4444&#x27;,
              borderWidth: 1.5,
              borderDash: [3, 3],
              pointRadius: 0
            },
            {
              label: &#x27;Total (Real+Proy)&#x27;,
              data: lineAvgTotal,
              borderColor: &#x27;#ffffff&#x27;,
              borderWidth: 2.5,
              borderDash: [7, 7],
              pointRadius: 0
            },
            {
              label: &#x27;VLL Max&#x27;,
              data: lineMax,
              borderColor: &#x27;#c084fc&#x27;,
              borderWidth: 2.5,
              borderDash: [3, 3],
              pointRadius: 0
            },
            {
              label: &#x27;VLL Min&#x27;,
              data: lineMin,
              borderColor: &#x27;#64748b&#x27;,
              borderWidth: 2.5,
              borderDash: [2, 2],
              pointRadius: 0
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { labels: { color: &#x27;#cbd5e1&#x27;, font: { size: 10 } } },
            tooltip: {
              callbacks: {
                label: function(context) {
                  let label = context.dataset.label || &#x27;&#x27;;
                  const val = context.parsed.y;
                  const currentHari = context.label.replace(&#x27;H-&#x27;, &#x27;&#x27;);

                  if (label) label += &#x27;: &#x27;;
                  if (val !== null) {
                    label += Math.round(val).toLocaleString(&#x27;id-ID&#x27;) + &#x27; Kendaraan&#x27;;
                  }

                  if (context.datasetIndex === 0) {
                    if (currentHari == vllPuncak.hari) {
                      label += &#x27; 🔴 (VLL Puncak Historis)&#x27;;
                    } else if (currentHari == vllTerendah.hari) {
                      label += &#x27; 🔵 (VLL Terendah Historis)&#x27;;
                    }
                  }

                  return label;
                }
              }
            }
          },
          scales: {
            x: { ticks: { color: &#x27;#94a3b8&#x27; }, grid: { color: &#x27;#334155&#x27; } },
            y: { ticks: { color: &#x27;#94a3b8&#x27; }, grid: { color: &#x27;#334155&#x27; } }
          }
        }
      });
    }
  &lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;"></iframe>
      </section>
<script>
(function(){
 const buttons=[...document.querySelectorAll('.tab-btn')], panels=[...document.querySelectorAll('.tab-panel')];
 function showPanel(n){
  buttons.forEach((b,i)=>{const a=i===n-1;b.classList.toggle('active',a);b.setAttribute('aria-selected',a?'true':'false')});
  panels.forEach((p,i)=>{const a=i===n-1;p.classList.toggle('active',a);p.setAttribute('aria-hidden',a?'false':'true')});
 }
 buttons.forEach(btn=>btn.addEventListener('click',()=>showPanel(Number(btn.dataset.panel))));
 showPanel(1);
})();
<\/script>
</body></html>`;

const monthlyFrame=document.getElementById("monthlyFrame");
const dailyFrame=document.getElementById("dailyFrame");
monthlyFrame.srcdoc = MONTHLY_HTML;
dailyFrame.srcdoc = DAILY_HTML;
let selectedView="monthly";
const selectedTabs={monthly:0,daily:0};
function clickInnerTab(view,index) {
 const frame = view === "monthly" ? monthlyFrame : dailyFrame;
 try {
  const doc = frame.contentDocument;
  if (!doc) return;
  if (view === "monthly") {
   const buttons = doc.querySelectorAll(".tabbtn");
   if (buttons[index]) buttons[index].click();
  } else {
   const buttons = doc.querySelectorAll(".tab-btn[data-panel]");
   if (buttons[index]) buttons[index].click();
  }
 } catch(e) {
  console.warn("Tab belum siap dipilih:", e);
 }
}
monthlyFrame.addEventListener("load", () => {
    clickInnerTab("monthly", selectedTabs.monthly);
});
dailyFrame.addEventListener("load", () => {
    clickInnerTab("daily", selectedTabs.daily);
});
function openView(view,index) {
 selectedView=view; selectedTabs[view]=index;
 monthlyFrame.classList.toggle("active",view==="monthly");
 dailyFrame.classList.toggle("active",view==="daily");
 document.querySelectorAll(".nav-btn[data-view]").forEach(b=>b.classList.toggle("active",b.dataset.view===view));
 document.querySelectorAll("#monthlySub .sub-btn").forEach((b,i)=>b.classList.toggle("active",view==="monthly"&&i===index));
 document.querySelectorAll("#dailySub .sub-btn").forEach((b,i)=>b.classList.toggle("active",view==="daily"&&i===index));
 clickInnerTab(view,index);
}
function toggleSidebar() {
    document.getElementById("app").classList.toggle("collapsed");
}
</script>
</body>
