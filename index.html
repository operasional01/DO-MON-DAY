<style>
:root{--sidebar:#fff;--bg:#f3f6fb;--text:#52525b;--muted:#71717a;--blue:#1d4ed8;--active:#eff6ff;--line:#e5e7eb}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;color:var(--text);background:var(--bg)}
.app{display:flex;width:100%;height:100vh;overflow:hidden}
.sidebar{width:305px;flex:0 0 305px;background:var(--sidebar);border-right:1px solid var(--line);overflow-y:auto;transition:width .2s,padding .2s}
.brandbar{height:106px;display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid #eef2f7}
.hamburger{border:0;background:transparent;color:#52525b;font-size:28px;line-height:1;cursor:pointer;padding:4px 2px}
.logo-circle{width:58px;height:58px;border:4px solid #1d4ed8;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#1d4ed8;font-weight:800;font-size:20px;flex-shrink:0}
.brand-name{font-size:18px;line-height:1.2;color:#1d4ed8}
.brand-name strong{font-size:21px;letter-spacing:-.4px}
.nav-area{padding:18px 10px 24px}
.group-title{font-size:18px;font-weight:700;color:#52525b;margin:20px 12px 12px}
.nav-btn{display:flex;align-items:center;gap:13px;width:100%;padding:13px 14px;margin:3px 0;border:0;border-radius:12px;background:transparent;color:#52525b;text-align:left;font-size:16px;cursor:pointer}
.nav-btn:hover,.sub-btn:hover{background:#f1f5f9}
.nav-btn.active,.sub-btn.active{background:var(--active);color:#2563eb;font-weight:700}
.nav-icon{width:22px;text-align:center;font-size:20px;flex-shrink:0}
.submenu{margin:0 0 10px 24px;padding-left:12px;border-left:2px solid #e5e7eb;display:block}
.sub-btn{display:block;width:100%;border:0;background:transparent;text-align:left;padding:10px 11px;border-radius:8px;margin:2px 0;color:#52525b;font-size:13px;line-height:1.35;cursor:pointer}
.main{min-width:0;flex:1;height:100vh;overflow:hidden;background:#e2e8f0}
.content-frame{display:none;width:100%;height:100%;border:0;background:#e2e8f0}
.content-frame.active{display:block}
.app.collapsed .sidebar{width:82px;flex-basis:82px}
.app.collapsed .brandbar{padding:12px;justify-content:center;flex-wrap:wrap;height:auto}
.app.collapsed .brand-name,.app.collapsed .group-title,.app.collapsed .nav-label,.app.collapsed .submenu{display:none}
.app.collapsed .nav-area{padding:14px 8px}
.app.collapsed .nav-btn{justify-content:center;padding:14px 6px}
@media(max-width:760px){
 .app{flex-direction:column}
 .sidebar{width:100%;flex:0 0 auto;max-height:48vh;border-right:0;border-bottom:1px solid var(--line)}
 .brandbar{height:78px;padding:8px 12px;gap:10px}
 .logo-circle{width:44px;height:44px;border-width:3px;font-size:16px}
 .brand-name{font-size:15px} .brand-name strong{font-size:17px}
 .nav-area{padding:6px 8px 10px}
 .group-title{font-size:14px;margin:8px 8px}
 .nav-btn{font-size:14px;padding:9px 10px;margin:2px 0}
 .submenu{margin-left:18px;padding-left:8px}
 .sub-btn{font-size:12px;padding:7px 9px}
 .main{height:calc(100vh - 48vh);flex:1}
 .app.collapsed .sidebar{width:100%;flex-basis:auto;max-height:78px;overflow:hidden}
 .app.collapsed .brandbar{height:78px;flex-wrap:nowrap;justify-content:flex-start}
}
</style>
</head>

              &lt;th class=&quot;p-3 text-center&quot;&gt;V&lt;/th&gt;
            &lt;/tr&gt;
          &lt;/thead&gt;
          &lt;tbody id=&quot;tbodyRiwayat&quot; class=&quot;divide-y divide-slate-200 bg-white&quot;&gt;&lt;/tbody&gt;
          &lt;tfoot id=&quot;tfootRiwayat&quot; class=&quot;bg-slate-800 text-white font-bold border-t-2 border-slate-600&quot;&gt;&lt;/tfoot&gt;

  &lt;!-- SCRIPT FIREBASE &amp; LOGIKA UTAMA --&gt;
  &lt;script type=&quot;module&quot;&gt;
    import { initializeApp } from &quot;https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js&quot;;
    import { 
      getDatabase, 
      ref, 
      push, 
      set, 
      onValue, 
      remove 
    } from &quot;https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js&quot;;

    const firebaseConfig = {
      apiKey: &quot;AIzaSyCWr4wsORe_eKWt-4AEnnHai9F-JzjMc7U&quot;,
      authDomain: &quot;m-e-ops.firebaseapp.com&quot;,
      databaseURL: &quot;https://m-e-ops-default-rtdb.asia-southeast1.firebasedatabase.app&quot;,
      projectId: &quot;m-e-ops&quot;,
      storageBucket: &quot;m-e-ops.firebasestorage.app&quot;,
      messagingSenderId: &quot;775606736462&quot;,
      appId: &quot;1:775606736462:web:9165314ab2a5f182d9151f&quot;
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const lhrRef = ref(db, &#x27;dataLHR&#x27;);

    let dataLHR = [];

    // Listener Realtime
    onValue(lhrRef, (snapshot) =&gt; {
      dataLHR = [];
      const val = snapshot.val();
      if (val) {
        Object.keys(val).forEach((key) =&gt; {
          dataLHR.push({
            dbKey: key,
            ...val[key]
          });
        });
      }
      // Urutkan data berdasarkan tanggal secara ascending
      dataLHR.sort((a, b) =&gt; a.periode.localeCompare(b.periode));
      render();
    });

    // Simpan Manual
    window.simpanDataManual = async function(e) {
      e.preventDefault();
      const editKey = document.getElementById(&#x27;editKey&#x27;).value;
      const periode = document.getElementById(&#x27;inputPeriode&#x27;).value;
      const hari = parseInt(document.getElementById(&#x27;inputHari&#x27;).value) || 0;
      const gol1 = parseInt(document.getElementById(&#x27;inputGol1&#x27;).value) || 0;
      const gol2 = parseInt(document.getElementById(&#x27;inputGol2&#x27;).value) || 0;
      const gol3 = parseInt(document.getElementById(&#x27;inputGol3&#x27;).value) || 0;
      const gol4 = parseInt(document.getElementById(&#x27;inputGol4&#x27;).value) || 0;
      const gol5 = parseInt(document.getElementById(&#x27;inputGol5&#x27;).value) || 0;
      const pendapatanTotal = parseFloat(document.getElementById(&#x27;inputPendapatanTotal&#x27;).value) || 0;

      const payload = { periode, hari, gol1, gol2, gol3, gol4, gol5, pendapatanTotal };

      try {
        if (editKey) {
          await set(ref(db, \`dataLHR/\${editKey}\`), payload);
        } else {
          const newRef = push(lhrRef);
          await set(newRef, payload);
        }
        window.batalEdit();
      } catch (err) {
        alert(&quot;Gagal menyimpan data ke database.&quot;);
      }
    };

    // Import Excel
    window.importExcel = function(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async function(e) {
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: &#x27;array&#x27; });
          const firstSheetName = workbook.SheetNames[0];
          const worksheet = workbook.Sheets[firstSheetName];
          const jsonData = XLSX.utils.sheet_to_json(worksheet);

          let count = 0;
          for (const row of jsonData) {
            const payload = {
              periode: row.periode ? String(row.periode).trim() : &#x27;&#x27;,
              hari: parseInt(row.hari) || 0,
              gol1: parseInt(row.gol1) || 0,
              gol2: parseInt(row.gol2) || 0,
              gol3: parseInt(row.gol3) || 0,
              gol4: parseInt(row.gol4) || 0,
              gol5: parseInt(row.gol5) || 0,
              pendapatanTotal: parseFloat(row.pendapatanTotal) || 0
            };

            if (payload.periode &amp;&amp; payload.hari &gt; 0) {
              const newRef = push(lhrRef);
              await set(newRef, payload);
              count++;
            }
          }

          alert(\`Berhasil mengunggah \${count} baris data!\`);
          document.getElementById(&#x27;excelFileInput&#x27;).value = &#x27;&#x27;;
        } catch (error) {
          alert(&quot;Gagal memproses file Excel!&quot;);
        }
      };
      reader.readAsArrayBuffer(file);
    };

    // Hapus Satuan Data
    window.hapusData = async function(dbKey) {
      if (confirm(&#x27;Yakin ingin menghapus data dari server?&#x27;)) {
        await remove(ref(db, \`dataLHR/\${dbKey}\`));
        window.batalEdit();
      }
    };

    // Hapus Semua Data (Reset Database)
    window.hapusSemuaData = async function() {
      if (dataLHR.length === 0) {
        return alert(&quot;Database sudah kosong!&quot;);
      }
      
      const konfirmasi1 = confirm(&quot;Apakah Anda YAKIN ingin menghapus SELURUH data di database?&quot;);
      if (konfirmasi1) {
        const konfirmasi2 = confirm(&quot;PERINGATAN: Tindakan ini tidak dapat dibatalkan. Klik OK untuk menghapus permanen.&quot;);
        if (konfirmasi2) {
          try {
            await remove(lhrRef);
            window.batalEdit();
            alert(&quot;Semua data berhasil dihapus dari database.&quot;);
          } catch (err) {
            alert(&quot;Gagal menghapus semua data.&quot;);
          }
        }
      }
    };

    // Form Helper
    window.editData = function(dbKey) {
      const item = dataLHR.find(d =&gt; d.dbKey === dbKey);
      if (!item) return;

      document.getElementById(&#x27;editKey&#x27;).value = item.dbKey;
      document.getElementById(&#x27;inputPeriode&#x27;).value = item.periode;
      document.getElementById(&#x27;inputHari&#x27;).value = item.hari;
      document.getElementById(&#x27;inputGol1&#x27;).value = item.gol1;
      document.getElementById(&#x27;inputGol2&#x27;).value = item.gol2;
      document.getElementById(&#x27;inputGol3&#x27;).value = item.gol3;
      document.getElementById(&#x27;inputGol4&#x27;).value = item.gol4;
      document.getElementById(&#x27;inputGol5&#x27;).value = item.gol5;
      document.getElementById(&#x27;inputPendapatanTotal&#x27;).value = item.pendapatanTotal || 0;

      document.getElementById(&#x27;formTitle&#x27;).innerHTML = &#x27;&lt;span&gt;✏️&lt;/span&gt; Edit Data&#x27;;
      document.getElementById(&#x27;btnSubmit&#x27;).innerText = &#x27;Update Data&#x27;;
      document.getElementById(&#x27;btnSubmit&#x27;).className = &#x27;w-full bg-amber-600 hover:bg-amber-700 text-white font-medium py-2 text-sm rounded-lg transition-colors shadow&#x27;;
      document.getElementById(&#x27;btnBatalEdit&#x27;).classList.remove(&#x27;hidden&#x27;);

      window.scrollTo({ top: 0, behavior: &#x27;smooth&#x27; });
    };

    window.batalEdit = function() {
      document.getElementById(&#x27;editKey&#x27;).value = &#x27;&#x27;;
      document.getElementById(&#x27;lhrForm&#x27;).reset();
      document.getElementById(&#x27;inputGol1&#x27;).value = &#x27;&#x27;;
      document.getElementById(&#x27;inputGol2&#x27;).value = &#x27;&#x27;;
      document.getElementById(&#x27;inputGol3&#x27;).value = &#x27;&#x27;;
      document.getElementById(&#x27;inputGol4&#x27;).value = &#x27;&#x27;;
      document.getElementById(&#x27;inputGol5&#x27;).value = &#x27;&#x27;;
      document.getElementById(&#x27;inputPendapatanTotal&#x27;).value = &#x27;&#x27;;

      document.getElementById(&#x27;formTitle&#x27;).innerHTML = &#x27;&lt;span&gt;➕&lt;/span&gt; Form Input Manual&#x27;;
      document.getElementById(&#x27;btnSubmit&#x27;).innerText = &#x27;Simpan Ke Database&#x27;;
      document.getElementById(&#x27;btnSubmit&#x27;).className = &#x27;w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 text-sm rounded-lg transition-colors shadow&#x27;;
      document.getElementById(&#x27;btnBatalEdit&#x27;).classList.add(&#x27;hidden&#x27;);
    };

    // Render Tabel Utama
    function render() {
      const tbodyRiwayat = document.getElementById(&#x27;tbodyRiwayat&#x27;);
      const tfootRiwayat = document.getElementById(&#x27;tfootRiwayat&#x27;);
      tbodyRiwayat.innerHTML = &#x27;&#x27;;

      if (dataLHR.length === 0) {
        tbodyRiwayat.innerHTML = \`&lt;tr&gt;&lt;td colspan=&quot;11&quot; class=&quot;p-4 text-center text-slate-400&quot;&gt;Belum ada data di database.&lt;/td&gt;&lt;/tr&gt;\`;
        tfootRiwayat.innerHTML = &#x27;&#x27;;
        return;
      }

      let g1Total = 0, g2Total = 0, g3Total = 0, g4Total = 0, g5Total = 0, totalHariAll = 0;
      let grandTotalPendapatan = 0;

      dataLHR.forEach((item) =&gt; {
        const totalVll = item.gol1 + item.gol2 + item.gol3 + item.gol4 + item.gol5;
        const totalPendapatan = item.pendapatanTotal || 0;
        const lhr = Math.round(totalVll / item.hari);

        g1Total += item.gol1; g2Total += item.gol2; g3Total += item.gol3;
        g4Total += item.gol4; g5Total += item.gol5; totalHariAll += item.hari;
        grandTotalPendapatan += totalPendapatan;

        tbodyRiwayat.innerHTML += \`
          &lt;tr class=&quot;hover:bg-slate-50 transition-colors&quot;&gt;
            &lt;td class=&quot;p-3 font-semibold text-slate-700&quot;&gt;\${formatTanggal(item.periode)}&lt;/td&gt;
            &lt;td class=&quot;p-3 text-center&quot;&gt;\${item.hari} hari&lt;/td&gt;
            &lt;td class=&quot;p-3 text-right&quot;&gt;\${item.gol1.toLocaleString(&#x27;id-ID&#x27;)}&lt;/td&gt;
            &lt;td class=&quot;p-3 text-right&quot;&gt;\${item.gol2.toLocaleString(&#x27;id-ID&#x27;)}&lt;/td&gt;
            &lt;td class=&quot;p-3 text-right&quot;&gt;\${item.gol3.toLocaleString(&#x27;id-ID&#x27;)}&lt;/td&gt;
            &lt;td class=&quot;p-3 text-right&quot;&gt;\${item.gol4.toLocaleString(&#x27;id-ID&#x27;)}&lt;/td&gt;
            &lt;td class=&quot;p-3 text-right&quot;&gt;\${item.gol5.toLocaleString(&#x27;id-ID&#x27;)}&lt;/td&gt;
            &lt;td class=&quot;p-3 text-right font-bold text-blue-600&quot;&gt;\${totalVll.toLocaleString(&#x27;id-ID&#x27;)}&lt;/td&gt;
            &lt;td class=&quot;p-3 text-right font-bold text-blue-600&quot;&gt;\${lhr.toLocaleString(&#x27;id-ID&#x27;)}&lt;/td&gt;
            &lt;td class=&quot;p-3 text-right font-bold text-emerald-600 font-mono&quot;&gt;Rp \${totalPendapatan.toLocaleString(&#x27;id-ID&#x27;)}&lt;/td&gt;
            &lt;td class=&quot;p-3 text-center space-x-1&quot;&gt;
              &lt;button onclick=&quot;editData(&#x27;\${item.dbKey}&#x27;)&quot; class=&quot;text-amber-600 font-medium px-2 py-1 rounded bg-amber-50&quot;&gt;Edit&lt;/button&gt;
              &lt;button onclick=&quot;hapusData(&#x27;\${item.dbKey}&#x27;)&quot; class=&quot;text-rose-600 font-medium px-2 py-1 rounded bg-rose-50&quot;&gt;Hapus&lt;/button&gt;
            &lt;/td&gt;
          &lt;/tr&gt;
        \`;
      });

      // Total VLL Keseluruhan
      const grandTotalVll = g1Total + g2Total + g3Total + g4Total + g5Total;
      // Total LHR Keseluruhan = Total VLL / Total Hari
      const totalLHR = totalHariAll &gt; 0 ? Math.round(grandTotalVll / totalHariAll) : 0;

      tfootRiwayat.innerHTML = \`
        &lt;tr&gt;
          &lt;td class=&quot;p-3&quot;&gt;TOTAL&lt;/td&gt;
          &lt;td class=&quot;p-3 text-center&quot;&gt;\${totalHariAll} hari&lt;/td&gt;
          &lt;td class=&quot;p-3 text-right&quot;&gt;\${g1Total.toLocaleString(&#x27;id-ID&#x27;)}&lt;/td&gt;
          &lt;td class=&quot;p-3 text-right&quot;&gt;\${g2Total.toLocaleString(&#x27;id-ID&#x27;)}&lt;/td&gt;
          &lt;td class=&quot;p-3 text-right&quot;&gt;\${g3Total.toLocaleString(&#x27;id-ID&#x27;)}&lt;/td&gt;
          &lt;td class=&quot;p-3 text-right&quot;&gt;\${g4Total.toLocaleString(&#x27;id-ID&#x27;)}&lt;/td&gt;
          &lt;td class=&quot;p-3 text-right&quot;&gt;\${g5Total.toLocaleString(&#x27;id-ID&#x27;)}&lt;/td&gt;
          &lt;td class=&quot;p-3 text-right text-blue-300&quot;&gt;\${grandTotalVll.toLocaleString(&#x27;id-ID&#x27;)}&lt;/td&gt;
          &lt;td class=&quot;p-3 text-right text-blue-300&quot;&gt;\${totalLHR.toLocaleString(&#x27;id-ID&#x27;)}&lt;/td&gt;
          &lt;td class=&quot;p-3 text-right text-emerald-300 font-mono&quot;&gt;Rp \${grandTotalPendapatan.toLocaleString(&#x27;id-ID&#x27;)}&lt;/td&gt;
          &lt;td class=&quot;p-3 text-center&quot;&gt;&lt;/td&gt;
        &lt;/tr&gt;
      \`;
    }

    function formatTanggal(str) {
      if (!str) return &#x27;-&#x27;;
      const parts = String(str).split(&#x27;-&#x27;);
      if (parts.length &lt; 3) return str;
      const namaBulan = [&quot;Januari&quot;, &quot;Februari&quot;, &quot;Maret&quot;, &quot;April&quot;, &quot;Mei&quot;, &quot;Juni&quot;, &quot;Juli&quot;, &quot;Agustus&quot;, &quot;September&quot;, &quot;Oktober&quot;, &quot;November&quot;, &quot;Desember&quot;];
      const tgl = parseInt(parts[2], 10);
      const bulan = namaBulan[parseInt(parts[1], 10) - 1] || parts[1];
      return \`\${tgl} \${bulan} \${parts[0]}\`;
    }

    window.downloadTemplate = function() {
      const templateData = [
        { periode: &quot;2026-09-15&quot;, hari: 1, gol1: 500, gol2: 140, gol3: 60, gol4: 30, gol5: 15, pendapatanTotal: 16500000 },
        { periode: &quot;2026-09-16&quot;, hari: 1, gol1: 550, gol2: 150, gol3: 65, gol4: 35, gol5: 14, pendapatanTotal: 17800000 }
      ];
      const wb = XLSX.utils.book_new();
      const ws = XLSX.utils.json_to_sheet(templateData);
      XLSX.utils.book_append_sheet(wb, ws, &quot;Template_LHR&quot;);
      XLSX.writeFile(wb, &quot;Template_Import_LHR_Harian.xlsx&quot;);
    };

    window.eksporExcel = function() {
      if (dataLHR.length === 0) return alert(&quot;Tidak ada data!&quot;);
      const wb = XLSX.utils.book_new();
      const excelData = dataLHR.map(d =&gt; {
        const totalVll = d.gol1 + d.gol2 + d.gol3 + d.gol4 + d.gol5;
        return {
          &quot;Tanggal&quot;: formatTanggal(d.periode),
          &quot;Jumlah Hari&quot;: d.hari,
          &quot;Golongan I (VLL)&quot;: d.gol1,
          &quot;Golongan II (VLL)&quot;: d.gol2,
          &quot;Golongan III (VLL)&quot;: d.gol3,
          &quot;Golongan IV (VLL)&quot;: d.gol4,
          &quot;Golongan V (VLL)&quot;: d.gol5,
          &quot;Total VLL&quot;: totalVll,
          &quot;LHR&quot;: Math.round(totalVll / d.hari),
          &quot;Pendapatan Total (Rp)&quot;: d.pendapatanTotal || 0
        };
      });
      const ws = XLSX.utils.json_to_sheet(excelData);
      XLSX.utils.book_append_sheet(wb, ws, &quot;Rekap Harian LHR &amp; Pendapatan&quot;);
      XLSX.writeFile(wb, &quot;Rekap_Monitoring_LHR_Harian.xlsx&quot;);
    };
  &lt;/script&gt;

            const monthNames = [
                &quot;Januari&quot;, &quot;Februari&quot;, &quot;Maret&quot;, &quot;April&quot;, &quot;Mei&quot;, &quot;Juni&quot;, 
                &quot;Juli&quot;, &quot;Agustus&quot;, &quot;September&quot;, &quot;Oktober&quot;, &quot;November&quot;, &quot;Desember&quot;
            ];

            const dayCounts = { &quot;Senin&quot;: 0, &quot;Selasa&quot;: 0, &quot;Rabu&quot;: 0, &quot;Kamis&quot;: 0, &quot;Jumat&quot;: 0, &quot;Sabtu&quot;: 0, &quot;Minggu&quot;: 0 };
            const jsDayToName = [&quot;Minggu&quot;, &quot;Senin&quot;, &quot;Selasa&quot;, &quot;Rabu&quot;, &quot;Kamis&quot;, &quot;Jumat&quot;, &quot;Sabtu&quot;];

            for (let d = 1; d &lt;= daysInMonth; d++) {
                const dateObj = new Date(year, month, d);
                const dayName = jsDayToName[dateObj.getDay()];
                dayCounts[dayName]++;
            }

            return {
                daysInMonth,
                monthName: monthNames[month],
                year,
                dayCounts
            };
        }

        function calculateTrimMean(arr) {
            if (!arr || arr.length === 0) return 0;
            if (arr.length &lt;= 2) {
                const sum = arr.reduce((a, b) =&gt; a + b, 0);
                return sum / arr.length;
            }
            const sorted = [...arr].sort((a, b) =&gt; a - b);
            sorted.shift();
            sorted.pop();
            const sum = sorted.reduce((a, b) =&gt; a + b, 0);
            return sum / sorted.length;
        }

            const labels = dataReport.map(item =&gt; item.periode);

            const hasPrognosaVll = dataReport.some(item =&gt; (parseInt(item.prognosaVll) || 0) &gt; 0);

                return prognosaVll &gt; 0 &amp;&amp; item.hari &gt; 0
                    ? Math.round(prognosaVll / item.hari)

            if (lhrChartInstance) {

            const chartDatasets = [

                    pointBackgroundColor: &#x27;#7c3aed&#x27;,
                    pointRadius: 4,
                    tension: 0.3,
                    fill: false

            lhrChartInstance = new Chart(ctx, {

        function renderDashboardTrimmeanForecast() {
            const realtimeInfo = getRealtimeDaysInMonth();
            const listHari = [&quot;Senin&quot;, &quot;Selasa&quot;, &quot;Rabu&quot;, &quot;Kamis&quot;, &quot;Jumat&quot;, &quot;Sabtu&quot;, &quot;Minggu&quot;];

            listHari.forEach(h =&gt; { dataPerHari[h] = []; });

            let totalHariRI = 0;
            let totalVllRI = 0;
            let totalProjVllRA = 0;

            dataReport.forEach(item =&gt; {
                const periodeText = (item.periode || &quot;&quot;).toString().toLowerCase().trim();
                const inputHari = parseInt(item.hari) || 0;
                const realVll = parseInt(item.realVll) || 0;
                const projVll = parseInt(item.projVll) || 0;

                totalHariRI += inputHari;
                totalVllRI += realVll;
                totalProjVllRA += projVll;

                listHari.forEach(h =&gt; {
                    if (periodeText.includes(h.toLowerCase())) {
                        const lhrHarian = inputHari &gt; 0 ? (realVll / inputHari) : 0;
                        if (lhrHarian &gt; 0) {
                            dataPerHari[h].push(lhrHarian);
                        }
                    }
                });
            });

            document.getElementById(&#x27;txtBulanRealtime&#x27;).innerText = \`\${realtimeInfo.monthName} \${realtimeInfo.year}\`;
            document.getElementById(&#x27;txtJumlahHariBulan&#x27;).innerText = \`\${realtimeInfo.daysInMonth} Hari\`;

            const tbody = document.getElementById(&#x27;tbodyTrimmean&#x27;);
            tbody.innerHTML = &#x27;&#x27;;

            let sumLhrTrimmed = 0;
            let activeDaysCount = 0;

            listHari.forEach(h =&gt; {
                const arrLhr = dataPerHari[h];
                const countData = arrLhr.length;
                const totalVllHari = arrLhr.reduce((a, b) =&gt; a + b, 0);
                const avgLhr = countData &gt; 0 ? (totalVllHari / countData) : 0;
                const trimmedLhr = calculateTrimMean(arrLhr);

                if (countData &gt; 0) {
                    sumLhrTrimmed += trimmedLhr;
                    activeDaysCount++;
                }

                const frekuensiHariRealtime = realtimeInfo.dayCounts[h] || 4;
                const estimasiBulanHari = trimmedLhr * frekuensiHariRealtime;

                tbody.innerHTML += \`
                    &lt;tr class=&quot;hover:bg-indigo-900/30 transition&quot;&gt;
                        &lt;td class=&quot;py-2.5 px-3 font-semibold text-indigo-200&quot;&gt;\${h} (\${frekuensiHariRealtime}x)&lt;/td&gt;
                        &lt;td class=&quot;py-2.5 px-3 text-center font-mono&quot;&gt;\${countData} Sampel&lt;/td&gt;
                        &lt;td class=&quot;py-2.5 px-3 text-center font-mono&quot;&gt;\${formatNum(totalVllHari)}&lt;/td&gt;
                        &lt;td class=&quot;py-2.5 px-3 text-center font-mono text-slate-300&quot;&gt;\${formatNum(avgLhr)}&lt;/td&gt;
                        &lt;td class=&quot;py-2.5 px-3 text-center font-mono font-bold text-amber-400&quot;&gt;\${formatNum(trimmedLhr)}&lt;/td&gt;
                        &lt;td class=&quot;py-2.5 px-3 text-center font-mono font-bold text-emerald-400&quot;&gt;\${formatNum(estimasiBulanHari)}&lt;/td&gt;
                    &lt;/tr&gt;
                \`;
            });

            const avgLhrTrimmedGlobal = activeDaysCount &gt; 0 ? (sumLhrTrimmed / activeDaysCount) : 0;
            const targetTotalHari = realtimeInfo.daysInMonth;
            const sisaHari = Math.max(0, targetTotalHari - totalHariRI);
            const estimasiSisaVll = sisaHari * avgLhrTrimmedGlobal;
            const totalForecastVll = totalVllRI + estimasiSisaVll;
            
            const estLhrAveraged = targetTotalHari &gt; 0 ? (totalForecastVll / targetTotalHari) : 0;
            const deviasiForecastVsRa = totalForecastVll - totalProjVllRA;
            const persenPencapaianEstVsRa = totalProjVllRA &gt; 0 ? ((totalForecastVll / totalProjVllRA) * 100).toFixed(1) : 0;

            document.getElementById(&#x27;fcHariInput&#x27;).innerText = \`\${totalHariRI} / \${targetTotalHari} Hari\`;
            document.getElementById(&#x27;fcSisaHari&#x27;).innerText = \`\${sisaHari} Hari\`;
            document.getElementById(&#x27;fcLhrTrimmed&#x27;).innerText = formatNum(avgLhrTrimmedGlobal);
            document.getElementById(&#x27;fcEstimasiSisa&#x27;).innerText = formatNum(estimasiSisaVll);
            document.getElementById(&#x27;fcTotalForecast&#x27;).innerText = formatNum(totalForecastVll);

            document.getElementById(&#x27;cardEstLhr&#x27;).innerText = formatNum(estLhrAveraged);
            document.getElementById(&#x27;cardEstSisaVll&#x27;).innerText = formatNum(estimasiSisaVll);

            badgeEstVsRa.className = \`font-bold \${persenPencapaianEstVsRa &gt;= 100 ? &#x27;text-teal-400&#x27; : &#x27;text-rose-400&#x27;}\`;
        }

        function downloadExcelTemplatePanel2() {
            const templateData = [{
                &#x27;Periode&#x27;: &#x27;&#x27;,
                &#x27;Hari&#x27;: &#x27;&#x27;,
                &#x27;Proyeksi VLL&#x27;: &#x27;&#x27;,
                &#x27;Realisasi VLL&#x27;: &#x27;&#x27;,
                &#x27;Proyeksi Pendapatan (Rp)&#x27;: &#x27;&#x27;,
                &#x27;Realisasi Pendapatan (Rp)&#x27;: &#x27;&#x27;
            }];

            const ws = XLSX.utils.json_to_sheet(templateData, { skipHeader: false });
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, &#x27;Format Input&#x27;);
            ws[&#x27;!cols&#x27;] = [
                { wch: 28 }, { wch: 10 }, { wch: 18 },
                { wch: 18 }, { wch: 25 }, { wch: 25 }
            ];
            XLSX.writeFile(wb, &#x27;Format_Excel_Panel_2_Evaluasi_VLL.xlsx&#x27;);
        }

        async function uploadExcelPanel2(event) {
            const file = event.target.files[0];
            if (!file) return;

            try {
                const data = await file.arrayBuffer();
                const workbook = XLSX.read(data, { type: &#x27;array&#x27; });
                const sheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[sheetName];
                const rows = XLSX.utils.sheet_to_json(worksheet, { defval: &#x27;&#x27; });

                if (!rows.length) {
                    alert(&#x27;File Excel tidak berisi data.&#x27;);
                    event.target.value = &#x27;&#x27;;
                    return;
                }

                let count = 0;
                let skipped = 0;

                for (const row of rows) {
                    const periode = String(row[&#x27;Periode&#x27;] ?? row[&#x27;periode&#x27;] ?? &#x27;&#x27;).trim();
                    const hari = parseInt(row[&#x27;Hari&#x27;] ?? row[&#x27;hari&#x27;]) || 0;
                    const projVll = parseInt(row[&#x27;Proyeksi VLL&#x27;] ?? row[&#x27;projVll&#x27;]) || 0;
                    const realVll = parseInt(row[&#x27;Realisasi VLL&#x27;] ?? row[&#x27;realVll&#x27;]) || 0;
                    const projRev = parseFloat(row[&#x27;Proyeksi Pendapatan (Rp)&#x27;] ?? row[&#x27;Proyeksi Pendapatan&#x27;] ?? row[&#x27;projRev&#x27;]) || 0;
                    const realRev = parseFloat(row[&#x27;Realisasi Pendapatan (Rp)&#x27;] ?? row[&#x27;Realisasi Pendapatan&#x27;] ?? row[&#x27;realRev&#x27;]) || 0;

                    if (!periode || hari &lt; 0) {
                        skipped++;
                        continue;
                    }

                    await dbRef.push({ periode, hari, projVll, realVll, projRev, realRev });
                    count++;
                }

                alert(\`Berhasil mengunggah \${count} baris data.\${skipped ? \` \${skipped} baris dilewati karena format/data tidak valid.\` : &#x27;&#x27;}\`);
            } catch (error) {
                console.error(error);
                alert(&#x27;Gagal membaca atau mengunggah file Excel: &#x27; + error.message);
            } finally {
                event.target.value = &#x27;&#x27;;
            }
        }

        function exportToExcel() {
            if (dataReport.length === 0) return alert(&#x27;Data kosong!&#x27;);
            
            const exportData = dataReport.map(item =&gt; {
                const devVll = item.realVll - item.projVll;
                const capaiVll = item.projVll &gt; 0 ? ((item.realVll / item.projVll) * 100).toFixed(2) + &#x27;%&#x27; : &#x27;0%&#x27;;
                const devRev = item.realRev - item.projRev;
                const capaiRev = item.projRev &gt; 0 ? ((item.realRev / item.projRev) * 100).toFixed(2) + &#x27;%&#x27; : &#x27;0%&#x27;;

                return {
                    &#x27;Periode&#x27;: item.periode,
                    &#x27;Hari&#x27;: item.hari,
                    &#x27;Proyeksi VLL&#x27;: item.projVll,
                    &#x27;Realisasi VLL&#x27;: item.realVll,
                    &#x27;Deviasi VLL&#x27;: devVll,
                    &#x27;% Capai VLL&#x27;: capaiVll,
                    &#x27;Proyeksi Pendapatan (Rp)&#x27;: item.projRev,
                    &#x27;Realisasi Pendapatan (Rp)&#x27;: item.realRev,
                    &#x27;Deviasi Pendapatan (Rp)&#x27;: devRev,
                    &#x27;% Capai Pendapatan&#x27;: capaiRev,
                };
            });

            const ws = XLSX.utils.json_to_sheet(exportData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, &quot;Evaluasi VLL vs Realisasi&quot;);
            XLSX.writeFile(wb, \`Laporan_Perbandingan_VLL_\${new Date().toISOString().slice(0,10)}.xlsx\`);
        }

            &lt;label for=&quot;vllMaxInput&quot; class=&quot;text-[11px] text-slate-300 block mb-1&quot;&gt;VLL Max (Batas Atas):&lt;/label&gt;
            &lt;input type=&quot;number&quot; id=&quot;vllMaxInput&quot; value=&quot;0&quot; oninput=&quot;simpanDanProses()&quot; class=&quot;w-full p-1.5 bg-slate-900 border border-purple-500/50 rounded text-xs font-mono text-purple-300 focus:outline-none&quot;&gt;

    &lt;!-- Section 2: Panel Rata-rata Persentase &amp; Growth VLL Per Hari (Senin - Minggu) --&gt;
    &lt;div class=&quot;bg-slate-800 p-5 rounded-xl border border-slate-700 space-y-4&quot;&gt;
      &lt;div class=&quot;border-b border-slate-700 pb-2 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2&quot;&gt;
        &lt;h2 class=&quot;text-lg font-semibold text-slate-200 flex items-center gap-2&quot;&gt;
          &lt;span&gt;📅 Rata-rata Kontribusi (%) &amp; Growth VLL Harian (Senin – Minggu)&lt;/span&gt;
        &lt;/h2&gt;

    &lt;!-- Section 3: Dashboard Proyeksi &amp; Proyeksi Pendapatan --&gt;
    &lt;div class=&quot;bg-slate-800 p-5 rounded-xl border border-slate-700 space-y-6&quot;&gt;
      &lt;h2 class=&quot;text-lg font-semibold text-slate-200 border-b border-slate-700 pb-2 flex items-center justify-between&quot;&gt;

        &lt;!-- Kolom Grafik &amp; Panel Hasil Analisis --&gt;

          &lt;div class=&quot;bg-slate-900/50 p-4 rounded-lg border border-slate-700/70 h-80&quot;&gt;
            &lt;canvas id=&quot;vllChart&quot;&gt;&lt;/canvas&gt;
          &lt;/div&gt;

          &lt;!-- Panel Hasil Analisis Grafis --&gt;
          &lt;div class=&quot;bg-slate-900/80 p-4 rounded-lg border border-slate-700 text-xs space-y-2&quot;&gt;
            &lt;div class=&quot;flex items-center justify-between border-b border-slate-800 pb-1.5&quot;&gt;
              &lt;span class=&quot;font-bold text-amber-400 flex items-center gap-1.5&quot;&gt;
                &lt;span&gt;💡&lt;/span&gt; Ringkasan &amp; Insights Grafik
              &lt;/span&gt;
              &lt;span id=&quot;analisisStatusTag&quot; class=&quot;px-2 py-0.5 rounded text-[10px] font-semibold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30&quot;&gt;
                Aman
              &lt;/span&gt;
            &lt;/div&gt;
            &lt;div id=&quot;analisisText&quot; class=&quot;text-slate-300 leading-relaxed space-y-1&quot;&gt;
              &lt;!-- Hasil analisis dinamis dirender lewat JavaScript --&gt;
            &lt;/div&gt;
          &lt;/div&gt;
        &lt;/div&gt;

        &lt;!-- Tabel Analisis Kapasitas &amp; Panel Ringkasan Targets &amp; Pendapatan --&gt;
        &lt;div class=&quot;bg-slate-900/50 p-4 rounded-lg border border-slate-700/70 overflow-hidden flex flex-col justify-between space-y-4&quot;&gt;
          &lt;div&gt;
            &lt;h3 class=&quot;text-xs font-semibold text-slate-400 uppercase mb-3&quot;&gt;Tabel Analisis Proyeksi VLL&lt;/h3&gt;
            &lt;div class=&quot;overflow-y-auto max-h-44 pr-1&quot;&gt;
              &lt;table class=&quot;w-full text-left text-[11px]&quot;&gt;
                &lt;thead class=&quot;text-slate-400 border-b border-slate-700 sticky top-0 bg-slate-900&quot;&gt;
                  &lt;tr&gt;
                    &lt;th class=&quot;pb-2&quot;&gt;Hari&lt;/th&gt;
                    &lt;th class=&quot;pb-2 text-center&quot;&gt;Est.VLL&lt;/th&gt;
                    &lt;th class=&quot;pb-2 text-center&quot;&gt;Sisa&lt;br&gt;&lt;span class=&quot;text-center text-[9px] text-slate-500&quot;&gt;(Max - Est)&lt;/span&gt;&lt;/th&gt;
                    &lt;th class=&quot;pb-2 text-center&quot;&gt;Tercapai&lt;br&gt;&lt;span class=&quot;text-center text-[9px] text-slate-500&quot;&gt;(Est / Target)&lt;/span&gt;&lt;/th&gt;
                  &lt;/tr&gt;
                &lt;/thead&gt;
                &lt;tbody id=&quot;tabelProyeksiBody&quot; class=&quot;divide-y divide-slate-800 font-mono&quot;&gt;

          &lt;!-- Container Bawah (Status Pencapaian Target &amp; Proyeksi Pendapatan) --&gt;
          &lt;div class=&quot;space-y-3&quot;&gt;
            &lt;!-- Panel Status Pencapaian Target --&gt;
            &lt;div class=&quot;pt-3 border-t border-slate-800 bg-emerald-950/30 p-3 rounded-lg border border-emerald-900/40 space-y-2&quot;&gt;
              &lt;div class=&quot;flex justify-between items-center&quot;&gt;
                &lt;span class=&quot;text-[11px] text-amber-400 font-semibold&quot;&gt;LHR Total (Realisasi + Proyeksi) :&lt;/span&gt;
                &lt;span id=&quot;valOkupansiTarget&quot; class=&quot;text-xs font-mono text-amber-400 font-bold&quot;&gt;-&lt;/span&gt;
              &lt;/div&gt;
              &lt;div class=&quot;flex justify-between items-end border-b border-emerald-900/50 pb-2&quot;&gt;
                &lt;span id=&quot;valVLLTarget&quot; class=&quot;text-base font-bold font-mono text-white&quot;&gt;-&lt;/span&gt;
                &lt;span id=&quot;valGapTarget&quot; class=&quot;text-[10px] font-mono text-white&quot;&gt;-&lt;/span&gt;
              &lt;/div&gt;
              &lt;div id=&quot;targetAchievementBox&quot; class=&quot;text-[10px] font-mono pt-1 flex justify-between items-center text-slate-300&quot;&gt;
                &lt;span&gt;Status Pencapaian Target:&lt;/span&gt;
                &lt;span id=&quot;valStatusPencapaian&quot; class=&quot;font-bold text-emerald-400&quot;&gt;-&lt;/span&gt;
              &lt;/div&gt;
            &lt;/div&gt;

            &lt;!-- Card Proyeksi Pendapatan --&gt;
            &lt;div class=&quot;p-3 bg-gradient-to-r from-cyan-950/60 to-slate-900 rounded-lg border border-cyan-500/40 space-y-2&quot;&gt;
              &lt;div class=&quot;flex justify-between items-center&quot;&gt;
                &lt;span class=&quot;text-[10px] uppercase tracking-wider text-cyan-400 font-semibold block&quot;&gt;Proyeksi Pendapatan&lt;/span&gt;
              &lt;/div&gt;
              
              &lt;div class=&quot;space-y-1&quot;&gt;
                &lt;div class=&quot;flex justify-between items-center text-[10px]&quot;&gt;
                  &lt;span class=&quot;text-amber-400 font-medium&quot;&gt;Est. PHT Proyeksi :&lt;/span&gt;
                  &lt;span id=&quot;valEstimasiPendapatanProyeksiSaja&quot; class=&quot;font-bold font-mono text-amber-300&quot;&gt;Rp 0&lt;/span&gt;
                &lt;/div&gt;
                &lt;div class=&quot;flex justify-between items-center text-[10px] pt-1 border-t border-cyan-900/30&quot;&gt;
                  &lt;span class=&quot;font-bold text-slate-200&quot;&gt;Total (Realisasi + Proyeksi) :&lt;/span&gt;
                  &lt;span id=&quot;valProyeksiPendapatan&quot; class=&quot;font-bold font-mono text-cyan-300&quot;&gt;Rp 0&lt;/span&gt;
                &lt;/div&gt;
              &lt;/div&gt;

              &lt;div id=&quot;detailFormulaPendapatan&quot; class=&quot;text-[9px] font-mono text-slate-400 pt-1 border-t border-cyan-900/50&quot;&gt;
                Formula: (Total VLL Realisasi + Proyeksi) × Tarif Rata-rata
              &lt;/div&gt;
            &lt;/div&gt;
          &lt;/div&gt;

        &lt;/div&gt;

      &lt;/div&gt;
    &lt;/div&gt;

  &lt;/div&gt;

  &lt;script&gt;
    const STORAGE_KEY_HISTORIS = &#x27;vll_dashboard_historis_harian_v3_CAGR_S1_2&#x27;;
    const STORAGE_KEY_DURASI = &#x27;vll_dashboard_durasi_harian_v3_CAGR_S1_2&#x27;;
    const STORAGE_KEY_KOREKSI = &#x27;vll_dashboard_koreksi_harian_v3_CAGR_S1_2&#x27;;
    const STORAGE_KEY_KOREKSI_MINGGUAN = &#x27;vll_dashboard_koreksi_mingguan_v1&#x27;;
    const STORAGE_KEY_VLL_MAX = &#x27;vll_dashboard_vll_max_harian_v3_CAGR_S1_2&#x27;;
    const STORAGE_KEY_VLL_MIN = &#x27;vll_dashboard_vll_min_harian_v3_CAGR_S1_2&#x27;;
    const STORAGE_KEY_VLL_TARGET = &#x27;vll_dashboard_vll_target_harian_v3_CAGR_S1_2&#x27;;
    const STORAGE_KEY_TARIF = &#x27;vll_dashboard_tarif_rata_rata_v1&#x27;;
    const STORAGE_KEY_CONFIDENCE = &#x27;vll_dashboard_confidence_level_v1&#x27;;

    const LIST_HARI_STANDAR = [&#x27;Senin&#x27;, &#x27;Selasa&#x27;, &#x27;Rabu&#x27;, &#x27;Kamis&#x27;, &#x27;Jumat&#x27;, &#x27;Sabtu&#x27;, &#x27;Minggu&#x27;];

    const defaultData = [
      { namaHari: &#x27;Senin&#x27;, hari: 1, vll: 9000 },
      { namaHari: &#x27;Selasa&#x27;, hari: 2, vll: 10000 },
      { namaHari: &#x27;Rabu&#x27;, hari: 3, vll: 10500 },
      { namaHari: &#x27;Kamis&#x27;, hari: 4, vll: 11000 },
      { namaHari: &#x27;Jumat&#x27;, hari: 5, vll: 13000 },
      { namaHari: &#x27;Sabtu&#x27;, hari: 6, vll: 15000 },
      { namaHari: &#x27;Minggu&#x27;, hari: 7, vll: 12000 }
    ];

    let chartInstance = null;

    window.onload = function() {
      muatDataDariStorage();
    };

    function muatDataDariStorage() {
      const savedData = localStorage.getItem(STORAGE_KEY_HISTORIS);
      let dataHistoris = savedData ? JSON.parse(savedData) : defaultData;

      const savedDurasi = localStorage.getItem(STORAGE_KEY_DURASI);
      if (savedDurasi) document.getElementById(&#x27;durasiProyeksi&#x27;).value = savedDurasi;

      const savedMax = localStorage.getItem(STORAGE_KEY_VLL_MAX);
      document.getElementById(&#x27;vllMaxInput&#x27;).value = savedMax !== null ? savedMax : 0;

      const savedMin = localStorage.getItem(STORAGE_KEY_VLL_MIN);
      document.getElementById(&#x27;vllMinInput&#x27;).value = savedMin !== null ? savedMin : 0;

      const savedTarget = localStorage.getItem(STORAGE_KEY_VLL_TARGET);
      document.getElementById(&#x27;vllTargetInput&#x27;).value = savedTarget !== null ? savedTarget : 0;

      const savedTarif = localStorage.getItem(STORAGE_KEY_TARIF);
      document.getElementById(&#x27;tarifRataRataInput&#x27;).value = savedTarif !== null ? savedTarif : 0;

      const savedConfidence = localStorage.getItem(STORAGE_KEY_CONFIDENCE);
      document.getElementById(&#x27;confidenceLevelInput&#x27;).value = savedConfidence !== null ? savedConfidence : 100;

      renderFormInputs(dataHistoris);
      updateFormKoreksiUI(false);
      simpanDanProses();
    }

    function renderFormInputs(data) {
      const container = document.getElementById(&#x27;inputList&#x27;);
      container.innerHTML = &#x27;&#x27;;
      data.forEach((item, index) =&gt; {
        const valNamaHari = item.namaHari || \`Hari \${item.hari || index + 1}\`;
        const div = document.createElement(&#x27;div&#x27;);
        div.className = &#x27;flex items-center gap-1.5 baris-input&#x27;;
        div.innerHTML = \`
          &lt;input type=&quot;text&quot; placeholder=&quot;Nama Hari&quot; value=&quot;\${valNamaHari}&quot; oninput=&quot;updateFormKoreksiUI(false); simpanDanProses();&quot; class=&quot;nama-hari-input w-2/5 p-1 bg-slate-900 border border-slate-700 rounded text-xs text-emerald-400 focus:outline-none focus:border-emerald-500 font-semibold&quot;&gt;
          &lt;input type=&quot;number&quot; placeholder=&quot;Hari&quot; value=&quot;\${item.hari}&quot; oninput=&quot;updateFormKoreksiUI(false); simpanDanProses();&quot; class=&quot;hari-input w-1/5 p-1 bg-slate-900 border border-slate-700 rounded text-xs focus:outline-none focus:border-emerald-500 font-mono text-center&quot;&gt;
          &lt;input type=&quot;number&quot; placeholder=&quot;VLL&quot; value=&quot;\${item.vll}&quot; oninput=&quot;updateFormKoreksiUI(false); simpanDanProses();&quot; class=&quot;vll-input w-2/5 p-1 bg-slate-900 border border-slate-700 rounded text-xs focus:outline-none focus:border-emerald-500 font-mono&quot;&gt;
          &lt;button onclick=&quot;hapusBarisUI(this)&quot; class=&quot;px-1.5 py-1 bg-rose-600/20 text-rose-400 hover:bg-rose-600 hover:text-white rounded text-xs transition-colors&quot;&gt;✕&lt;/button&gt;
        \`;
        container.appendChild(div);
      });
    }

    function resetKoreksiKeAvg() {
      localStorage.removeItem(STORAGE_KEY_KOREKSI);
      updateFormKoreksiUI(true);
      simpanDanProses();
    }

    function resetKoreksiMingguan() {
      localStorage.removeItem(STORAGE_KEY_KOREKSI_MINGGUAN);
      updateFormKoreksiUI(false);
      simpanDanProses();
    }

    function updateFormKoreksiUI(forceResetToAvg = false) {
      const container = document.getElementById(&#x27;koreksiList&#x27;);
      const containerMingguan = document.getElementById(&#x27;koreksiMingguanList&#x27;);
      const durasi = parseInt(document.getElementById(&#x27;durasiProyeksi&#x27;).value) || 1;
      
      const hariInputs = document.querySelectorAll(&#x27;.hari-input&#x27;);
      const namaHariInputs = document.querySelectorAll(&#x27;.nama-hari-input&#x27;);
      const vllInputs = document.querySelectorAll(&#x27;.vll-input&#x27;);

      // 1. Ambil data input historis
      let dataInput = [];
      hariInputs.forEach((inputHari, idx) =&gt; { 
        if (inputHari.value) {
          const vllVal = parseFloat(vllInputs[idx] ? vllInputs[idx].value : 0);
          dataInput.push({
            hari: parseInt(inputHari.value),
            namaHari: namaHariInputs[idx] ? namaHariInputs[idx].value.trim() : &#x27;&#x27;,
            vll: !isNaN(vllVal) ? vllVal : 0
          });
        }
      });

      dataInput.sort((a, b) =&gt; a.hari - b.hari);

      // 2. Kalkulasi Rata-rata Growth per Hari (Senin - Minggu)
      let group7Hari = {};
      LIST_HARI_STANDAR.forEach(h =&gt; {
        group7Hari[h] = [];
      });

      dataInput.forEach((item, index) =&gt; {
        if (index &gt; 0) {
          const vllLalu = dataInput[index - 1].vll;
          if (vllLalu &gt; 0 &amp;&amp; item.vll &gt; 0) {
            const growth = ((item.vll / vllLalu) - 1) * 100;
            const nama = (item.namaHari || &#x27;&#x27;).trim();
            const matchHari = LIST_HARI_STANDAR.find(h =&gt; h.toLowerCase() === nama.toLowerCase());
            if (matchHari) {
              group7Hari[matchHari].push(growth);
            }
          }
        }
      });

      let mapAvgGrowthHari = {};
      LIST_HARI_STANDAR.forEach(hari =&gt; {
        const arr = group7Hari[hari];
        if (arr.length &gt; 0) {
          const avg = arr.reduce((a, b) =&gt; a + b, 0) / arr.length;
          mapAvgGrowthHari[hari] = parseFloat(avg.toFixed(2));
        } else {
          mapAvgGrowthHari[hari] = 0;
        }
      });
      
      const hariAkhir = dataInput.length &gt; 0 ? dataInput[dataInput.length - 1].hari : 0;
      const namaHariAkhir = dataInput.length &gt; 0 ? dataInput[dataInput.length - 1].namaHari : &#x27;&#x27;;

      let indexNamaHari = LIST_HARI_STANDAR.findIndex(h =&gt; h.toLowerCase() === namaHariAkhir.toLowerCase());
      
      const savedKoreksi = forceResetToAvg ? {} : JSON.parse(localStorage.getItem(STORAGE_KEY_KOREKSI) || &#x27;{}&#x27;);

      container.innerHTML = &#x27;&#x27;;
      for (let h = 1; h &lt;= durasi; h++) {
        const hrProyeksi = hariAkhir + h;

        let labelHari = \`H-\${hrProyeksi}\`;
        let namaHariProyeksi = &#x27;&#x27;;

        if (indexNamaHari !== -1) {
          namaHariProyeksi = LIST_HARI_STANDAR[(indexNamaHari + h) % LIST_HARI_STANDAR.length];
          labelHari = \`\${namaHariProyeksi} (H-\${hrProyeksi})\`;
        } else if (namaHariAkhir !== &#x27;&#x27;) {
          labelHari = \`\${namaHariAkhir} +\${h} (H-\${hrProyeksi})\`;
        }

        let defaultGrowth = 0;
        if (namaHariProyeksi &amp;&amp; mapAvgGrowthHari[namaHariProyeksi] !== undefined) {
          defaultGrowth = mapAvgGrowthHari[namaHariProyeksi];
        }

        const valKoreksi = savedKoreksi[hrProyeksi] !== undefined ? savedKoreksi[hrProyeksi] : defaultGrowth;

        const div = document.createElement(&#x27;div&#x27;);
        div.className = &#x27;flex items-center justify-between gap-1 bg-slate-900/60 p-1 rounded border border-slate-700/60&#x27;;
        div.innerHTML = \`
          &lt;span class=&quot;text-[11px] text-slate-300 font-mono&quot;&gt;\${labelHari}:&lt;/span&gt;
          &lt;div class=&quot;flex items-center gap-1&quot;&gt;
            &lt;input type=&quot;number&quot; step=&quot;0.1&quot; value=&quot;\${valKoreksi}&quot; data-hari=&quot;\${hrProyeksi}&quot; oninput=&quot;simpanDanProses()&quot; class=&quot;koreksi-input w-14 p-0.5 bg-slate-800 border border-slate-600 rounded text-center text-xs font-mono text-amber-400 focus:outline-none&quot;&gt;
            &lt;span class=&quot;text-[10px] text-slate-400&quot;&gt;%&lt;/span&gt;
          &lt;/div&gt;
        \`;
        container.appendChild(div);
      }

      // 3. Render Panel Koreksi Mingguan (Pola Kalender)
      const totalMinggu = Math.ceil(durasi / 7);
      const savedKoreksiMingguan = JSON.parse(localStorage.getItem(STORAGE_KEY_KOREKSI_MINGGUAN) || &#x27;{}&#x27;);

      containerMingguan.innerHTML = &#x27;&#x27;;
      for (let m = 1; m &lt;= totalMinggu; m++) {
        const valKoreksiMinggu = savedKoreksiMingguan[m] !== undefined ? savedKoreksiMingguan[m] : 0;
        const divM = document.createElement(&#x27;div&#x27;);
        divM.className = &#x27;flex items-center justify-between gap-1 bg-slate-900/60 p-1 rounded border border-cyan-900/60&#x27;;
        divM.innerHTML = \`
          &lt;span class=&quot;text-[11px] text-cyan-300 font-mono&quot;&gt;Minggu ke-\${m}:&lt;/span&gt;
          &lt;div class=&quot;flex items-center gap-1&quot;&gt;
            &lt;input type=&quot;number&quot; step=&quot;0.1&quot; value=&quot;\${valKoreksiMinggu}&quot; data-minggu=&quot;\${m}&quot; oninput=&quot;simpanDanProses()&quot; class=&quot;koreksi-minggu-input w-14 p-0.5 bg-slate-800 border border-cyan-600 rounded text-center text-xs font-mono text-cyan-400 focus:outline-none&quot;&gt;
            &lt;span class=&quot;text-[10px] text-slate-400&quot;&gt;%&lt;/span&gt;
          &lt;/div&gt;
        \`;
        containerMingguan.appendChild(divM);
      }
    }

    function tambahBarisUI() {
      const container = document.getElementById(&#x27;inputList&#x27;);
      const baris = document.querySelectorAll(&#x27;.baris-input&#x27;);
      const lastHariVal = baris.length &gt; 0 ? parseInt(baris[baris.length - 1].querySelector(&#x27;.hari-input&#x27;).value) || baris.length : baris.length;
      const nextHariVal = lastHariVal + 1;

      let nextNamaHari = \`Hari \${nextHariVal}\`;
      if (baris.length &gt; 0) {
        const lastNamaInput = baris[baris.length - 1].querySelector(&#x27;.nama-hari-input&#x27;);
        const lastNamaVal = lastNamaInput ? lastNamaInput.value.trim() : &#x27;&#x27;;
        const idxLast = LIST_HARI_STANDAR.findIndex(h =&gt; h.toLowerCase() === lastNamaVal.toLowerCase());
        if (idxLast !== -1) {
          nextNamaHari = LIST_HARI_STANDAR[(idxLast + 1) % LIST_HARI_STANDAR.length];
        }
      } else {
        nextNamaHari = LIST_HARI_STANDAR[0];
      }

      const div = document.createElement(&#x27;div&#x27;);
      div.className = &#x27;flex items-center gap-1.5 baris-input&#x27;;
      div.innerHTML = \`
        &lt;input type=&quot;text&quot; placeholder=&quot;Nama Hari&quot; value=&quot;\${nextNamaHari}&quot; oninput=&quot;updateFormKoreksiUI(false); simpanDanProses();&quot; class=&quot;nama-hari-input w-2/5 p-1 bg-slate-900 border border-slate-700 rounded text-xs text-emerald-400 focus:outline-none focus:border-emerald-500 font-semibold&quot;&gt;
